<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="utf-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="https://i.postimg.cc/1tHS3fJ1/59993AE2-2E20-4810-93B3-F7285015B6F5.png"
    />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme color -->
    <meta name="theme-color" content="#000000" />

    <!-- ✅ SEO Description (Google) -->
    <meta
      name="description"
      content="Cine Editvala is a cinematic video editor specializing in wedding, pre-wedding and creative video edits."

    />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ✅ Open Graph (WhatsApp / Facebook / Instagram) -->
    <meta property="og:title" content="Cine Editvala | Cinematic Video Editor" />
    <meta
      property="og:description"
      content="Cine Editvala — cinematic video editor for weddings, pre-weddings and creative storytelling."
    />
    <meta
      property="og:image"
      content="https://i.postimg.cc/1tHS3fJ1/59993AE2-2E20-4810-93B3-F7285015B6F5.png"
    />

      property="og:url"
      content="https://portfolio-v1-tan-alpha.vercel.app/"
    />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Cine Editvala | Cinematic Video Editor"
    />
    <meta
      name="twitter:description"
      content="Cine Editvala — cinematic video editor for weddings and creative visual stories."
    />
    <meta
      name="twitter:image"
      content="https://i.postimg.cc/1tHS3fJ1/59993AE2-2E20-4810-93B3-F7285015B6F5.png"
    />

    <!-- ✅ Browser Tab Title (MOST IMPORTANT) -->
    <title>Cine Editvala | Cinematic Video Editor</title>
